<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none" role="img" aria-label="Clay price tag">
  <defs>
    <filter id="drop" x="-25%" y="-20%" width="150%" height="155%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#3B241B" flood-opacity="0.17"/>
    </filter>
    <filter id="clay" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur1"/>
      <feOffset dx="4" dy="4" in="blur1" result="off1"/>
      <feComposite in="SourceAlpha" in2="off1" operator="out" result="inv1"/>
      <feFlood flood-color="#FFF7EC" flood-opacity="0.65" result="col1"/>
      <feComposite in="col1" in2="inv1" operator="in" result="hi"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="blur2"/>
      <feOffset dx="-5" dy="-5" in="blur2" result="off2"/>
      <feComposite in="SourceAlpha" in2="off2" operator="out" result="inv2"/>
      <feFlood flood-color="#3B241B" flood-opacity="0.17" result="col2"/>
      <feComposite in="col2" in2="inv2" operator="in" result="sh"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="hi"/>
        <feMergeNode in="sh"/>
      </feMerge>
    </filter>
    <radialGradient id="tagPeach" cx="28%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#FFE6D4"/>
      <stop offset="52%" stop-color="#F6CDB0"/>
      <stop offset="100%" stop-color="#E7A782"/>
    </radialGradient>
    <radialGradient id="cordGrad" cx="35%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#E27552"/>
      <stop offset="55%" stop-color="#B84A28"/>
      <stop offset="100%" stop-color="#96391C"/>
    </radialGradient>
    <radialGradient id="ridgeGrad" cx="30%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#E47A57"/>
      <stop offset="60%" stop-color="#B84A28"/>
      <stop offset="100%" stop-color="#9E3C1E"/>
    </radialGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <g filter="url(#drop)" transform="rotate(14 90 90)">
    <!-- Soft clay string loop -->
    <path filter="url(#clay)" d="M90 48 C90 22, 118 18, 122 36 C125 49, 107 52, 95 49" stroke="url(#cordGrad)" stroke-width="8.5" stroke-linecap="round" fill="none"/>

    <!-- Plump clay tag body -->
    <path filter="url(#clay)" d="M74 39 L106 39 C114 39, 120 44, 124 51 L132 67 C134 71, 135 76, 135 81 L135 130 C135 142, 125 151, 113 151 L67 151 C55 151, 45 142, 45 130 L45 81 C45 76, 46 71, 48 67 L56 51 C60 44, 66 39, 74 39 Z" fill="url(#tagPeach)"/>

    <!-- Recessed clay eyelet hole -->
    <circle cx="90" cy="61" r="10" fill="#B97B59"/>
    <circle cx="90" cy="61" r="7.5" fill="#FBF3E6"/>
    <path d="M84 56 A7.5 7.5 0 0 1 96 56" stroke="#C78A68" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Sculpted terracotta price bars (clay relief) -->
    <rect x="64" y="92" width="52" height="14" rx="7" fill="#3B241B" opacity="0.14" filter="url(#softBlur)" transform="translate(1,3)"/>
    <rect filter="url(#clay)" x="63" y="90" width="54" height="14" rx="7" fill="url(#ridgeGrad)"/>

    <rect x="72" y="116" width="36" height="11" rx="5.5" fill="#3B241B" opacity="0.12" filter="url(#softBlur)" transform="translate(1,3)"/>
    <rect filter="url(#clay)" x="71" y="114" width="38" height="11" rx="5.5" fill="#EBD3AE"/>

    <!-- Subtle top-left satin highlight -->
    <ellipse cx="64" cy="78" rx="9" ry="18" transform="rotate(-12 64 78)" fill="#FFF7EC" opacity="0.34" filter="url(#softBlur)"/>
  </g>
</svg>

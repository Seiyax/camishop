<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none" role="img" aria-label="Clay shopping bag">
  <defs>
    <filter id="drop" x="-25%" y="-20%" width="150%" height="155%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#3B241B" flood-opacity="0.18"/>
    </filter>
    <filter id="clay" x="-15%" y="-15%" width="130%" height="130%">
      <!-- Soft inner top-left highlight -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur1"/>
      <feOffset dx="4" dy="5" in="blur1" result="off1"/>
      <feComposite in="SourceAlpha" in2="off1" operator="out" result="inv1"/>
      <feFlood flood-color="#FFF5EA" flood-opacity="0.52" result="col1"/>
      <feComposite in="col1" in2="inv1" operator="in" result="hi"/>
      <!-- Soft inner bottom-right shade -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur2"/>
      <feOffset dx="-5" dy="-6" in="blur2" result="off2"/>
      <feComposite in="SourceAlpha" in2="off2" operator="out" result="inv2"/>
      <feFlood flood-color="#22100A" flood-opacity="0.34" result="col2"/>
      <feComposite in="col2" in2="inv2" operator="in" result="sh"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="hi"/>
        <feMergeNode in="sh"/>
      </feMerge>
    </filter>
    <radialGradient id="bagBody" cx="30%" cy="22%" r="82%">
      <stop offset="0%" stop-color="#744B3C"/>
      <stop offset="48%" stop-color="#4F2F24"/>
      <stop offset="100%" stop-color="#2F1811"/>
    </radialGradient>
    <radialGradient id="handleGrad" cx="35%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#8A5E4E"/>
      <stop offset="55%" stop-color="#583529"/>
      <stop offset="100%" stop-color="#351C14"/>
    </radialGradient>
    <radialGradient id="charmGrad" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#E77B57"/>
      <stop offset="55%" stop-color="#B84A28"/>
      <stop offset="100%" stop-color="#96391C"/>
    </radialGradient>
    <radialGradient id="sheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4E6" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFF4E6" stop-opacity="0"/>
    </radialGradient>
    <filter id="aoBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <g filter="url(#drop)" transform="rotate(-7 90 92)">
    <!-- Back handle arch -->
    <path d="M68 62 C68 32, 112 32, 112 62" stroke="#361D15" stroke-width="11" stroke-linecap="round" fill="none"/>

    <!-- Plump trapezoid clay bag body -->
    <path filter="url(#clay)" d="M51 60 C53 53, 60 49, 68 49 L112 49 C120 49, 127 53, 129 60 L140 126 C142 138, 134 148, 121 148 L59 148 C46 148, 38 138, 40 126 Z" fill="url(#bagBody)"/>

    <!-- Soft clay highlight on upper-left cheek -->
    <ellipse cx="69" cy="84" rx="18" ry="28" transform="rotate(-10 69 84)" fill="url(#sheen)"/>

    <!-- Ambient occlusion under front handle -->
    <path d="M65 65 C65 73, 73 76, 75 70" stroke="#1E0E08" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round" filter="url(#aoBlur)"/>
    <path d="M115 65 C115 73, 107 76, 105 70" stroke="#1E0E08" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round" filter="url(#aoBlur)"/>

    <!-- Front clay handle arch -->
    <path filter="url(#clay)" d="M66 71 L66 56 C66 34, 114 34, 114 56 L114 71" stroke="url(#handleGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Subtle top highlight on handle -->
    <path d="M73 45 C82 37, 98 37, 107 44" stroke="#FFF1E2" stroke-opacity="0.32" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Small clay terracotta camel-tag button on bag -->
    <circle cx="114" cy="76" r="10.5" fill="#22100A" opacity="0.28" filter="url(#aoBlur)"/>
    <rect filter="url(#clay)" x="103" y="68" width="22" height="22" rx="8" fill="url(#charmGrad)"/>
    <circle cx="114" cy="79" r="3.2" fill="#EBD3AE"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none" role="img" aria-label="Clay heart">
  <defs>
    <filter id="drop" x="-25%" y="-20%" width="150%" height="155%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#3B241B" flood-opacity="0.17"/>
    </filter>
    <filter id="clay" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="blur1"/>
      <feOffset dx="5" dy="5" in="blur1" result="off1"/>
      <feComposite in="SourceAlpha" in2="off1" operator="out" result="inv1"/>
      <feFlood flood-color="#FFF5F2" flood-opacity="0.68" result="col1"/>
      <feComposite in="col1" in2="inv1" operator="in" result="hi"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="5.5" result="blur2"/>
      <feOffset dx="-5" dy="-6" in="blur2" result="off2"/>
      <feComposite in="SourceAlpha" in2="off2" operator="out" result="inv2"/>
      <feFlood flood-color="#3B241B" flood-opacity="0.26" result="col2"/>
      <feComposite in="col2" in2="inv2" operator="in" result="sh"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="hi"/>
        <feMergeNode in="sh"/>
      </feMerge>
    </filter>
    <radialGradient id="heartGrad" cx="30%" cy="24%" r="80%">
      <stop offset="0%" stop-color="#FFD4CB"/>
      <stop offset="44%" stop-color="#EDB5A8"/>
      <stop offset="82%" stop-color="#DC8674"/>
      <stop offset="100%" stop-color="#B95D4B"/>
    </radialGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <g filter="url(#drop)" transform="rotate(9 90 92)">
    <!-- Puffy matte clay heart -->
    <path filter="url(#clay)" d="M90 144 C84 144, 34 114, 34 75 C34 52, 51 37, 70 37 C80 37, 87 42, 90 48 C93 42, 100 37, 110 37 C129 37, 146 52, 146 75 C146 114, 96 144, 90 144 Z" fill="url(#heartGrad)"/>

    <!-- Soft plump pillow sheen on left lobe -->
    <ellipse cx="62" cy="64" rx="14" ry="18" transform="rotate(-24 62 64)" fill="#FFF7EC" opacity="0.45" filter="url(#softBlur)"/>
    <!-- Secondary subtle highlight on right lobe -->
    <ellipse cx="116" cy="62" rx="9" ry="11" transform="rotate(18 116 62)" fill="#FFF7EC" opacity="0.24" filter="url(#softBlur)"/>
  </g>
</svg>
